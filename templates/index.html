<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            color: #374151; 
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        h2 { 
            text-align: center; 
            color: #2563eb; 
            margin-bottom: 30px;
        }
        form { 
            display: grid; 
            gap: 15px; 
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label { 
            font-weight: 600; 
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select { 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 14px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { 
            background: #1d4ed8; 
        }
        .result { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            animation: fadeIn 0.5s;
        }
        .churn { 
            background-color: #fef2f2; 
            color: #b91c1c; 
            border: 1px solid #fecaca; 
        }
        .no-churn { 
            background-color: #f0fdf4; 
            color: #15803d; 
            border: 1px solid #bbf7d0; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Telecom Customer Churn Predictor</h2>
    <form method="POST">
        <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label>Senior Citizen</label>
            <select name="SeniorCitizen" required>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Partner</label>
            <select name="Partner" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Dependents</label>
            <select name="Dependents" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tenure (months)</label>
            <input type="number" name="tenure" min="0" required placeholder="e.g. 12">
        </div>

        <div class="form-group">
            <label>Internet Service</label>
            <select name="InternetService" required>
                <option value="DSL">DSL</option>
                <option value="Fiber optic">Fiber optic</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Contract</label>
            <select name="Contract" required>
                <option value="Month-to-month">Month-to-month</option>
                <option value="One year">One year</option>
                <option value="Two year">Two year</option>
            </select>
        </div>

        <div class="form-group">
            <label>Monthly Charges ($)</label>
            <input type="number" step="0.01" name="MonthlyCharges" min="0" required placeholder="e.g. 50">
        </div>

        <div class="form-group">
            <label>Total Charges ($)</label>
            <input type="number" step="0.01" name="TotalCharges" min="0" required placeholder="e.g. 600">
        </div>

        <button type="submit">Predict Churn</button>
    </form>

    {% if prediction %}
        <div class="result {% if prediction == 'Churn' %}churn{% else %}no-churn{% endif %}">
            Prediction result: <b>{{ prediction }}</b>
        </div>
    {% endif %}
</div>

</body>
</html>
